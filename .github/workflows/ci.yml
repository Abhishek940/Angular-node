name: Angular CI

on:
  push:
    branches:
      - angular
      

  pull_request:
    branches:
      - angular
      
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build Angular application
        run: npm run build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        run: npx angular-cli-ghpages --dir=dist/angular-frontend/browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
